[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "partforge"
version = "1.0.0"
description = "PartForge – datenbankbasierte Bauteilbibliotheken (DbLib) für Altium Designer erstellen und pflegen"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "SQLAlchemy>=2.0.36",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "anthropic>=1.12,<2",
    "pypdf>=5",
    "pypdfium2>=4.30",
    "pywebview>=5.3",
    "pyodbc>=5.2",
    "pywin32>=308; sys_platform == 'win32'",
    "openpyxl>=3.1",
    "odfpy>=1.4",
    "httpx>=0.27",
    "pillow>=11",
    "platformdirs>=4",
    "rapidfuzz>=3.10",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# playwright: scripts/screenshot.py (UI screenshots, headless Chrome/Edge); pdfplumber: tests/data/corpus/tools
test = ["pytest>=8", "playwright>=1.48", "pdfplumber>=0.11"]
# markdown: scripts/build.py renders the manual (docs/handbuch/BEDIENUNG.md) into the package as HTML
build = ["pyinstaller>=6.11", "markdown>=3.7"]

[project.gui-scripts]
partforge = "partforge.__main__:main"

[tool.setuptools.packages.find]
include = ["partforge*"]

[tool.setuptools.package-data]
partforge = ["web/**/*", "altium/bridge/scripts/*", "assets/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
